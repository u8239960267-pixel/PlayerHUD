name: Build Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and Build Project
        run: |
          # Szuka folderu z plikiem build.gradle i tam uruchamia kompilację
          GRADLE_DIR=$(find . -name "build.gradle" -exec dirname {} \;)
          echo "Znaleziono projekt w: $GRADLE_DIR"
          cd $GRADLE_DIR
          gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHUD-Jar
          path: "**/build/libs/*.jar"
